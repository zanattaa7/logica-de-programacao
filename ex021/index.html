<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Doação de Sangue</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>

    <p>
        <label for="nascimento">Qual sua data de nascimento?</label>
        <input type="date" id="nascimento">
        
    </p>

    <p>
        <label>Possui alguma doença?</label>

        <input type="radio" name="sick" id="inputSick" value="yes">
        <label for="inputSick">Sim</label>

        <input type="radio" name="sick" id="inputNo" value="no">
        <label for="inputNo">Não</label>
    </p>

    <p>
        <label for="peso">Peso atual:</label>
        <input type="number" id="peso">
        
    </p>

    <p>
        <label>Possui tatuagem recente?</label>

        <input type="radio" name="tattoo" id="inputTattoo" value="yes">
        <label for="inputTattoo">Sim</label>

        <input type="radio" name="tattoo" id="inputNoTattoo" value="no">
        <label for="inputNoTattoo">Não</label>
    </p>

    <p>
        <label>Está tomando algum medicamento?</label>

        <input type="radio" name="medicine" id="inputMedicine" value="yes">
        <label for="inputMedicine">Sim</label>

        <input type="radio" name="medicine" id="inputNoMedicine" value="no">
        <label for="inputNoMedicine">Não</label>
    </p>

    <input type="button" value="Verificar" onclick="verificar()">

    <p id="resultado"></p>

    <script src="script.js"></script>

</body>

</html>
